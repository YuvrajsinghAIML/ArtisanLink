<!DOCTYPE html><html lang="en" class="scroll-smooth"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superdesign | New Listing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --accent: #FF4500;
            --card: #111111;
            --text-warm: #FFE0E0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            overflow-x: hidden;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }

        .selection-red::selection {
            background: var(--accent);
            color: white;
        }

        /* Noise Texture */
        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.05;
            mix-blend-mode: overlay;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }

        /* Custom Animations */
        @keyframes float-slow {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(2deg); }
            66% { transform: translate(-20px, 20px) rotate(-1deg); }
        }

        .animate-float {
            animation: float-slow 20s ease-in-out infinite;
        }

        /* Aurora Background Effect */
        .aurora-blade {
            position: absolute;
            background: linear-gradient(135deg, #ff2f3a 0%, #ff6b4a 50%, #ffb347 100%);
            filter: blur(80px);
            opacity: 0.15;
            mix-blend-mode: screen;
            z-index: -1;
        }
    </style>
</head>
<body class="selection-red">
    <div class="min-h-screen bg-[#050505] relative flex flex-col" data-sd-id="1">
        <div class="noise-overlay" data-sd-id="2"></div>

        <!-- Navigation Component -->
        <sd-component componentid="8fb225ef-50c1-49cb-a323-60c2e36f90e7" name="PillNavigation" props="{&quot;activeItem&quot;:&quot;works&quot;,&quot;logoHref&quot;:&quot;https://draft-f719e7c5-5441-450e-8506-913bcdabaafd.preview.superdesign.dev&quot;,&quot;expertiseHref&quot;:&quot;https://draft-60b0ec5e-8e3c-473e-9714-9355e684ac04.preview.superdesign.dev&quot;,&quot;worksHref&quot;:&quot;https://draft-bfe9d062-6cd0-40d9-a10f-2b7f22a277cc.preview.superdesign.dev&quot;,&quot;ctaHref&quot;:&quot;#start-project&quot;}">
        </sd-component>

        <!-- Main Content Area -->
        <main class="flex-grow flex flex-col items-center justify-center pt-[120px] pb-20 relative z-10 px-6" data-sd-id="3">
            
            <!-- Aurora Background Elements (Subtle) -->
            <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden" data-sd-id="4">
                <div class="aurora-blade w-[600px] h-[300px] -top-20 -left-20 rotate-12 animate-float opacity-30" data-sd-id="5"></div>
                <div class="aurora-blade w-[500px] h-[400px] bottom-0 -right-20 -rotate-12 animate-float opacity-30" style="animation-delay: -5s;" data-sd-id="6"></div>
            </div>

            <!-- Header -->
            <div class="text-center mb-8 relative z-20" data-sd-id="7">
                <h1 class="text-5xl md:text-6xl font-serif font-semibold text-white mb-4" data-sd-id="8">
                    New <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#FF1493] to-[#FF4500]" data-sd-id="9">Listing</span>
                </h1>
                <p class="text-gray-400 text-lg font-light" data-sd-id="10">Snap a photo and our AI will help you list it</p>
            </div>

            <!-- Form Container -->
            <div class="w-full max-w-[480px] relative z-20" data-sd-id="11">
                
                <!-- Photo Upload Section -->
                <div class="w-full h-48 bg-[#1a1a1a] rounded-xl border border-dashed border-white/20 flex flex-col items-center justify-center mb-8 cursor-pointer hover:border-[#FF4500] hover:bg-[#1f1f1f] transition-colors group" data-sd-id="12">
                    <iconify-icon icon="lucide:cloud-upload" class="text-4xl text-[#FF1493] mb-3 group-hover:scale-110 transition-transform"></iconify-icon>
                    <span class="text-white font-medium mb-1" data-sd-id="13">Tap to Upload Photo</span>
                    <span class="text-gray-500 text-sm" data-sd-id="14">Make sure the item is well-lit</span>
                </div>

                <!-- Form Fields -->
                <form class="flex flex-col gap-6" data-sd-id="15">
                    
                    <!-- Location Button -->
                    <button type="button" class="w-full bg-blue-900/30 border border-blue-500/20 text-blue-400 hover:bg-blue-900/50 hover:border-blue-500/40 py-4 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors font-medium" data-sd-id="16">
                        <iconify-icon icon="lucide:map-pin" class="text-xl"></iconify-icon>
                        Detect My Location
                    </button>

                    <!-- Address Fields -->
                    <div class="space-y-4" data-sd-id="17">
                        <div class="flex flex-col" data-sd-id="18">
                            <label for="address" class="text-gray-300 text-sm font-medium mb-2" data-sd-id="19">Address</label>
                            <input type="text" id="address" placeholder="e.g. Jaipur, Rajasthan" class="w-full bg-[#1a1a1a] border border-white/10 rounded-lg py-3 px-4 text-white placeholder-gray-600 focus:outline-none focus:border-[#FF4500] focus:ring-1 focus:ring-[#FF4500] transition-colors text-sm" data-sd-id="20">
                        </div>
                        <div class="flex flex-col" data-sd-id="21">
                            <label for="pincode" class="text-gray-300 text-sm font-medium mb-2" data-sd-id="22">Pincode</label>
                            <input type="text" id="pincode" placeholder="e.g. 302001" class="w-full bg-[#1a1a1a] border border-white/10 rounded-lg py-3 px-4 text-white placeholder-gray-600 focus:outline-none focus:border-[#FF4500] focus:ring-1 focus:ring-[#FF4500] transition-colors text-sm" data-sd-id="23">
                        </div>
                    </div>

                    <!-- AI Generate Button -->
                    <button type="button" class="w-full bg-gradient-to-r from-[#1a1a1a] to-[#2a2a2a] border border-gray-600 text-gray-300 hover:text-white hover:border-[#FF4500]/50 py-4 px-4 rounded-xl flex items-center justify-center gap-2 transition-all hover:shadow-[0_0_15px_rgba(255,69,0,0.15)] mt-2" data-sd-id="24">
                        <iconify-icon icon="lucide:sparkles" class="text-[#FF4500]"></iconify-icon>
                        Auto-Generate Details (AI)
                    </button>

                    <!-- Product Details -->
                    <div class="space-y-4 mt-2" data-sd-id="25">
                        <div class="flex flex-col" data-sd-id="26">
                            <label for="title" class="text-gray-300 text-sm font-medium mb-2" data-sd-id="27">Title</label>
                            <input type="text" id="title" placeholder="e.g. Handcrafted Wooden Bowl" class="w-full bg-[#1a1a1a] border border-white/10 rounded-lg py-3 px-4 text-white placeholder-gray-600 focus:outline-none focus:border-[#FF4500] focus:ring-1 focus:ring-[#FF4500] transition-colors text-sm" data-sd-id="28">
                        </div>
                        
                        <div class="flex flex-col" data-sd-id="29">
                            <label for="description" class="text-gray-300 text-sm font-medium mb-2" data-sd-id="30">Description</label>
                            <textarea id="description" rows="4" placeholder="Describe your product..." class="w-full bg-[#1a1a1a] border border-white/10 rounded-lg py-3 px-4 text-white placeholder-gray-600 focus:outline-none focus:border-[#FF4500] focus:ring-1 focus:ring-[#FF4500] transition-colors text-sm resize-none" data-sd-id="31"></textarea>
                        </div>

                        <div class="flex flex-col" data-sd-id="32">
                            <label for="price" class="text-gray-300 text-sm font-medium mb-2" data-sd-id="33">Price (₹)</label>
                            <div class="relative" data-sd-id="34">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500" data-sd-id="35">₹</span>
                                <input type="number" id="price" placeholder="e.g. 500" class="w-full bg-[#1a1a1a] border border-white/10 rounded-lg py-3 pl-8 pr-4 text-white placeholder-gray-600 focus:outline-none focus:border-[#FF4500] focus:ring-1 focus:ring-[#FF4500] transition-colors text-sm" data-sd-id="36">
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full bg-[#FF4500] text-white font-semibold py-4 rounded-xl hover:bg-[#ff571a] transition-all hover:shadow-[0_0_20px_rgba(255,69,0,0.4)] hover:scale-[1.02] mt-6 flex items-center justify-center gap-2" data-sd-id="37">
                        List Product <iconify-icon icon="lucide:arrow-right"></iconify-icon>
                    </button>

                </form>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-12 border-t border-white/5 bg-[#050505] relative overflow-hidden z-20" data-sd-id="38">
            <div class="container mx-auto px-6" data-sd-id="39">
                <div class="flex flex-col md:flex-row justify-between items-center gap-6" data-sd-id="40">
                    <div class="text-xl font-bold tracking-tighter font-serif text-white/50" data-sd-id="41">
                        SUPERDESIGN.
                    </div>
                    
                    <div class="flex gap-6 text-gray-500 text-sm" data-sd-id="42">
                        <a href="#" class="hover:text-[#FF4500] transition-colors" data-sd-id="43">Instagram</a>
                        <a href="#" class="hover:text-[#FF4500] transition-colors" data-sd-id="44">Twitter</a>
                        <a href="#" class="hover:text-[#FF4500] transition-colors" data-sd-id="45">LinkedIn</a>
                    </div>
                    <p class="text-xs text-gray-600" data-sd-id="46">© 2024 Superdesign Agent. All rights reserved.</p>
                </div>
            </div>
        </footer>
    </div>

</body></html>
